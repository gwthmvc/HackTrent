name: Deploy React App to Vultr

on:
  push:
    branches: [ "main" ] # Triggers automatically on push to main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Match your local node version

      - name: Install Dependencies & Build
        run: |
          npm ci
          npm run build

      - name: Deploy to Vultr via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "dist/*" # Change to "build/*" if your output folder is named 'build'
          target: "/var/www/html/"
          strip_components: 1 # Flattens the dist folder so index.html lands directly in /var/www/html/