name: Deploy React App to Vultr

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies & Build
        run: |
          cd client
          npm ci
          npm run build

      - name: Deploy to Vultr via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "client/dist/*" # Points to the build output inside your client folder
          target: "/var/www/html/"
          strip_components: 2 # Flattens both 'client' and 'dist' folders so index.html lands directly in /var/www/html/