[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smartmove-backend"
version = "0.1.0"
description = "Read-only SmartMove Ontario transit API"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "httpx",
    "psycopg[binary,pool]",
    "pydantic-settings",
    "tzdata",
    "PyJWT[crypto]",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
